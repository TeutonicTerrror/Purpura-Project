<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's New in Purpura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'OpenDyslexic';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('fonts/OpenDyslexic-Regular.woff') format('woff');
        }
        @font-face {
            font-family: 'OpenDyslexic';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url('fonts/OpenDyslexic-Bold.woff') format('woff');
        }
        :root {
            --c-bg: #0b0c10;
            --c-surface: #111219;
            --c-card: #161720;
            --c-text: #f0eeff;
            --c-text-2: #a89ec4;
            --c-text-3: #6d6487;
            --c-accent: #9b6dff;
            --c-accent-dim: #6b44c7;
            --c-border: rgba(255, 255, 255, 0.07);
            --c-border-2: rgba(255, 255, 255, 0.12);
            --c-radius: 10px;
            --c-radius-lg: 14px;
            --c-font: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--c-bg);
            color: var(--c-text);
            font-family: var(--c-font);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 20px;
        }
        .page {
            width: 100%;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 2px;
            margin-bottom: 20px;
        }
        .topbar-logo {
            width: 38px;
            height: 38px;
            border-radius: var(--c-radius);
            flex-shrink: 0;
        }
        .topbar-text { min-width: 0; }
        .topbar-text h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #c4a7ff 0%, #9b6dff 52%, #7c4dff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.25;
        }
        .topbar-text span {
            display: block;
            font-size: 12px;
            color: var(--c-text-3);
        }
        .close-btn {
            margin-left: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--c-border);
            border-radius: 8px;
            background: var(--c-surface);
            color: var(--c-text-3);
            font-size: 17px;
            line-height: 1;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }
        .close-btn:hover {
            background: #1c1d28;
            border-color: var(--c-border-2);
            color: var(--c-text);
        }
        .changelog-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card {
            background: var(--c-card);
            border: 1px solid var(--c-border);
            border-radius: var(--c-radius-lg);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }
        .release {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 15px 18px;
        }
        .release-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }
        .release-date {
            margin-top: 2px;
            font-size: 12.5px;
            color: var(--c-text-3);
        }
        .chg-pill {
            flex-shrink: 0;
            padding: 4px 10px;
            border-radius: 99px;
            border: 1px solid rgba(155, 109, 255, 0.35);
            background: rgba(155, 109, 255, 0.14);
            color: #c9b6ff;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .chg-section {
            padding: 14px 18px 6px;
        }
        .chg-head {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 4px;
            padding-bottom: 11px;
            border-bottom: 1px solid var(--c-border);
            cursor: pointer;
            transition: border-color 0.15s ease;
        }
        .chg-toggle {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            padding: 0;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--c-text-3);
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease, transform 0.18s ease;
        }
        .chg-head:hover .chg-toggle {
            background: var(--c-surface);
            color: var(--c-text-2);
        }
        .chg-section.is-collapsed .chg-toggle { transform: rotate(-90deg); }
        .chg-section.is-collapsed { padding-bottom: 8px; }
        .chg-section.is-collapsed .chg-head {
            margin-bottom: 0;
            padding-bottom: 2px;
            border-bottom-color: transparent;
        }
        .chg-icon {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 7px;
            background: rgba(155, 109, 255, 0.12);
        }
        .chg-icon img {
            width: 15px;
            height: 15px;
            display: block;
        }
        .chg-title {
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: -0.1px;
            color: var(--c-text);
        }
        .chg-item {
            padding: 10px 0;
        }
        .chg-item + .chg-item {
            border-top: 1px solid var(--c-border);
        }
        .chg-text {
            font-size: 13px;
            line-height: 1.6;
            color: var(--c-text-2);
        }
        .chg-text strong {
            color: var(--c-text);
            font-weight: 600;
        }
        .chg-tag {
            display: inline-block;
            margin-right: 6px;
            padding: 2px 6px;
            border-radius: 5px;
            background: rgba(155, 109, 255, 0.12);
            color: #c1a9ff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            vertical-align: 1px;
        }
        .chg-tag[data-kind="new"] { background: rgba(155, 109, 255, 0.18); color: #cdb8ff; }
        .chg-tag[data-kind="addition"] { background: rgba(99, 102, 241, 0.18); color: #b3bcff; }
        .chg-tag[data-kind="reworked"] { background: rgba(34, 211, 238, 0.14); color: #8bdce5; }
        .chg-tag[data-kind="optimized"] { background: rgba(56, 152, 236, 0.17); color: #96cbfb; }
        .chg-tag[data-kind="improved"] { background: rgba(45, 212, 191, 0.14); color: #93e6cb; }
        .chg-tag[data-kind="adjusted"] { background: rgba(148, 163, 184, 0.16); color: #c6cedd; }
        .chg-tag[data-kind="fix"] { background: rgba(74, 222, 128, 0.15); color: #96e6b4; }
        .chg-tag[data-kind="potential"] { background: rgba(234, 179, 8, 0.15); color: #ecca7c; }
        .chg-tag[data-kind="removed"] { background: rgba(248, 113, 113, 0.15); color: #f6aeae; }
        .chg-tag[data-kind="renamed"] { background: rgba(236, 72, 153, 0.15); color: #f4b1e0; }
        .chg-tag[data-kind="toggle"] {
            background: rgba(155, 109, 255, 0.08);
            color: #d4c4ff;
            box-shadow: inset 0 0 0 1px rgba(167, 139, 250, 0.35);
        }
        .chg-tag[data-kind="beta"] { background: rgba(59, 130, 246, 0.22); color: #b0d0ff; }
        .chg-tag[data-kind="experimental"] { background: rgba(245, 158, 11, 0.17); color: #f4bd88; }
        .chg-subs {
            margin-top: 6px;
            padding-left: 11px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chg-subs .chg-subs {
            margin-top: 4px;
            padding-left: 15px;
        }
        .chg-subs .chg-subs .chg-sub { color: var(--c-text-3); opacity: 0.85; }
        .chg-sub {
            position: relative;
            padding-left: 12px;
            font-size: 12.5px;
            line-height: 1.55;
            color: var(--c-text-3);
        }
        .chg-sub::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--c-accent-dim);
        }
        .chg-sub strong {
            color: var(--c-text-2);
            font-weight: 600;
        }
        .changes-p {
            padding: 10px 0;
            font-size: 13px;
            line-height: 1.6;
            color: var(--c-text-2);
        }
        .changes-p strong { color: var(--c-text); font-weight: 600; }
        .changelog-card a {
            color: #bda6ff;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .changelog-card a:hover { color: #d8caff; }
        .purpura-emoji {
            height: 1.15em;
            width: 1.15em;
            vertical-align: -0.2em;
            display: inline;
            pointer-events: none;
        }
        .changelog-empty {
            padding: 34px 18px;
            text-align: center;
            color: var(--c-text-3);
            font-size: 13px;
        }
        .footer {
            margin-top: 20px;
            padding: 16px 18px;
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--c-radius-lg);
            text-align: center;
        }
        .footer-title {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--c-text);
        }
        .footer-sub {
            margin: 3px 0 12px;
            font-size: 12.5px;
            line-height: 1.5;
            color: var(--c-text-3);
        }
        .footer-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .footer-badge {
            display: inline-flex;
            align-items: center;
            height: 44px;
            border-radius: 8px;
            text-decoration: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .footer-badge:hover { opacity: 0.9; transform: translateY(-1px); }
        .footer-badge img {
            display: block;
            height: 44px;
            width: auto;
            border-radius: 8px;
        }
        .kofi-button {
            display: inline-flex;
            align-items: center;
            height: 44px;
            padding: 0 16px;
            border-radius: 8px;
            background: #000;
            color: #fff;
            text-decoration: none;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .kofi-button:hover { background: #222; transform: translateY(-1px); }
        .kofitext {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Quicksand', var(--c-font);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        .kofiimg {
            display: block;
            height: 16px;
            width: auto;
        }
        .a11y-btn {
            margin-left: auto;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--c-border);
            border-radius: 8px;
            background: var(--c-surface);
            color: var(--c-text-3);
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }
        .a11y-btn:hover,
        .a11y-btn[aria-expanded="true"] {
            background: #1c1d28;
            border-color: rgba(155, 109, 255, 0.35);
            color: var(--c-text);
        }
        .a11y-btn svg { display: block; }
        .a11y-panel {
            position: fixed;
            top: 74px;
            right: 20px;
            z-index: 30;
            width: 250px;
            padding: 10px;
            background: var(--c-card);
            border: 1px solid var(--c-border-2);
            border-radius: 12px;
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
        }
        .a11y-title {
            padding: 2px 8px 8px;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            color: var(--c-text-3);
        }
        .a11y-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 7px 8px;
            border-radius: 7px;
            cursor: pointer;
        }
        .a11y-row:hover { background: var(--c-surface); }
        .a11y-label { font-size: 12.5px; color: var(--c-text-2); }
        .a11y-row input { position: absolute; opacity: 0; width: 0; height: 0; }
        .a11y-switch {
            position: relative;
            flex: 0 0 auto;
            width: 32px;
            height: 18px;
            border-radius: 99px;
            background: #2b2c38;
            transition: background 0.15s ease;
        }
        .a11y-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.15s ease;
        }
        .a11y-row input:checked + .a11y-switch { background: var(--c-accent); }
        .a11y-row input:checked + .a11y-switch::after { transform: translateX(14px); }
        .a11y-row input:focus-visible + .a11y-switch { box-shadow: 0 0 0 2px rgba(155, 109, 255, 0.45); }
        html.a11y-dyslexia body,
        html.a11y-dyslexia button,
        html.a11y-dyslexia input {
            font-family: 'OpenDyslexic', Verdana, Tahoma, sans-serif;
        }
        html.a11y-dyslexia .chg-text,
        html.a11y-dyslexia .chg-sub,
        html.a11y-dyslexia .changes-p,
        html.a11y-dyslexia .release-title {
            line-height: 1.8;
            letter-spacing: 0.015em;
            word-spacing: 0.06em;
        }
        html.a11y-dyslexia .chg-tag,
        html.a11y-dyslexia .release-date,
        html.a11y-dyslexia .kofitext {
            font-family: 'OpenDyslexic', Verdana, Tahoma, sans-serif;
        }
        html.a11y-dyslexia h1,
        html.a11y-dyslexia .topbar-text h1 {
            -webkit-text-fill-color: currentColor;
            background: none;
            color: #c4a7ff;
        }
        html.a11y-large .chg-text,
        html.a11y-large .changes-p { font-size: 14.5px; }
        html.a11y-large .chg-sub { font-size: 13.5px; }
        html.a11y-large .chg-title { font-size: 15px; }
        html.a11y-large .release-title { font-size: 17px; }
        html.a11y-contrast {
            --c-text-2: #ded9ec;
            --c-text-3: #b6adc8;
            --c-border: rgba(255, 255, 255, 0.18);
            --c-border-2: rgba(255, 255, 255, 0.3);
        }
        html.a11y-contrast .chg-tag { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3); }
        html[data-a11y-colorblind="on"] .chg-tag {
            background: rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 0 0 1px currentColor;
        }
        html[data-a11y-colorblind="on"] .chg-tag[data-kind="new"],
        html[data-a11y-colorblind="on"] .chg-tag[data-kind="renamed"] { color: #dd95c0; }
        html[data-a11y-colorblind="on"] .chg-tag[data-kind="addition"],
        html[data-a11y-colorblind="on"] .chg-tag[data-kind="reworked"],
        html[data-a11y-colorblind="on"] .chg-tag[data-kind="beta"] { color: #67c2f0; }
        html[data-a11y-colorblind="on"] .chg-tag[data-kind="optimized"],
        html[data-a11y-colorblind="on"] .chg-tag[data-kind="improved"],
        html[data-a11y-colorblind="on"] .chg-tag[data-kind="fix"] { color: #5ed6a4; }
        html[data-a11y-colorblind="on"] .chg-tag[data-kind="potential"],
        html[data-a11y-colorblind="on"] .chg-tag[data-kind="experimental"] { color: #eeb44e; }
        html[data-a11y-colorblind="on"] .chg-tag[data-kind="removed"] { color: #ff9263; }
        html[data-a11y-colorblind="on"] .chg-tag[data-kind="adjusted"],
        html[data-a11y-colorblind="on"] .chg-tag[data-kind="toggle"] { color: #c3c3c3; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(155, 109, 255, 0.25); border-radius: 3px; }
    </style>
</head>
<body>
    <div class="page">
        <header class="topbar">
            <img class="topbar-logo" src="images/icons/default/Purpura_Default_Logo_128.png" alt="Purpura">
            <div class="topbar-text">
                <h1>What's New</h1>
                <span>Purpura Extension</span>
            </div>
            <button class="a11y-btn" id="a11yBtn" type="button" title="Accessibility options" aria-label="Accessibility options" aria-expanded="false" aria-controls="a11yPanel">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/>
                    <circle cx="12" cy="7.7" r="1.2" fill="currentColor" stroke="none"/>
                    <path d="M6.9 10.2c3.4.9 6.8 1 10.2 0"/>
                    <path d="M12 10.6v4.1"/>
                    <path d="M12 14.7 9.5 18.3M12 14.7l2.5 3.6"/>
                </svg>
            </button>
            <button class="close-btn" id="closeBtn" title="Close">&times;</button>
        </header>
        <div class="a11y-panel" id="a11yPanel" hidden>
            <p class="a11y-title">Accessibility</p>
            <label class="a11y-row">
                <span class="a11y-label">Colorblind-friendly tags</span>
                <input type="checkbox" data-a11y="colorblind">
                <span class="a11y-switch"></span>
            </label>
            <label class="a11y-row">
                <span class="a11y-label">Dyslexia-friendly font (OpenDyslexic)</span>
                <input type="checkbox" data-a11y="dyslexia">
                <span class="a11y-switch"></span>
            </label>
            <label class="a11y-row">
                <span class="a11y-label">Larger text</span>
                <input type="checkbox" data-a11y="large">
                <span class="a11y-switch"></span>
            </label>
            <label class="a11y-row">
                <span class="a11y-label">Higher contrast</span>
                <input type="checkbox" data-a11y="contrast">
                <span class="a11y-switch"></span>
            </label>
        </div>
        <main class="changelog-card" id="changelogCard">
            <div class="card changelog-empty">Nothing new to show yet.</div>
        </main>
        <footer class="footer">
            <p class="footer-title">Enjoying Purpura?</p>
            <p class="footer-sub">Leave a review to help more Roblox players discover Purpura.</p>
            <div class="footer-links">
                <a class="footer-badge" id="cwsReviewLink" href="https://chromewebstore.google.com/detail/purpura/lpneoiebggmkhlldeongbcipekohjepc" target="_blank" rel="noopener noreferrer">
                    <img src="images/chrome.png" alt="Available in the Chrome Web Store">
                </a>
                <a class="kofi-button" id="kofiLink" href="https://ko-fi.com/N0Q220I61C" target="_blank" rel="noopener noreferrer" title="Support me on ko-fi.com">
                    <span class="kofitext">
                        <img class="kofiimg" src="https://storage.ko-fi.com/cdn/cup-border.png" alt="Ko-fi donations">
                        Support Purpura
                    </span>
                </a>
            </div>
        </footer>
    </div>
    <script src="js/changes.js"></script>
    <script src="js/new.js"></script>
</body>
</html>
