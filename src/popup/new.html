<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's New in Purpura</title>
    <link href='https://fonts.googleapis.com/css?family=Quicksand:400,700' rel='stylesheet' type='text/css'>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(160deg, #0f0a1a 0%, #1a0d2e 50%, #0d0618 100%);
            color: rgba(255, 255, 255, 0.85);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 20px 32px;
        }
        .page {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 36px;
        }
        .header-logo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            flex-shrink: 0;
        }
        .header-text h1 {
            font-size: 22px;
            font-weight: 700;
            color: #f0eeff;
            letter-spacing: -0.3px;
            margin-bottom: 2px;
        }
        .header-text span {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            font-weight: 500;
        }
        .close-btn {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        .changelog-card {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.06), rgba(109, 40, 217, 0.03));
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: auto;
        }
        .changelog-card h2 {
            font-size: 20px;
            font-weight: 700;
            color: #f0eeff;
            margin-bottom: 10px;
        }
        .changelog-card .date {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 18px;
        }
        .changelog-card .changes-body {
            color: rgba(255, 255, 255, 0.65);
            font-size: 14px;
            line-height: 1.7;
        }
        .changelog-card .changes-h1,
        .changelog-card .changes-h2 {
            font-size: 13px;
            font-weight: 700;
            color: #c4b5fd;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin: 24px 0 12px;
        }
        .changelog-card .changes-h1:first-child,
        .changelog-card .changes-h2:first-child {
            margin-top: 0;
        }
        .changelog-card .changes-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .changelog-card .changes-list > li {
            position: relative;
            padding-left: 22px;
            margin-bottom: 8px;
        }
        .changelog-card .changes-list > li:last-child {
            margin-bottom: 0;
        }
        .changelog-card .changes-list > li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.5);
        }
        .changelog-card .changes-sublist {
            list-style: none;
            padding: 0;
            margin: 6px 0 6px 8px;
        }
        .changelog-card .changes-sublist > li {
            position: relative;
            padding-left: 18px;
            margin-bottom: 6px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }
        .changelog-card .changes-sublist > li:last-child {
            margin-bottom: 0;
        }
        .changelog-card .changes-sublist > li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.25);
        }
        .changelog-card .changes-p {
            margin: 0 0 10px;
        }
        .changelog-card .changes-p:last-child {
            margin-bottom: 0;
        }
        .changelog-card strong {
            color: #c4b5fd;
            font-weight: 600;
        }
        .changelog-card a {
            color: #c4b5fd;
            text-decoration: underline;
            text-underline-offset: 2px;
            transition: color 0.15s;
        }
        .changelog-card a:hover {
            color: #ddd1ff;
        }
        .purpura-emoji {
            height: 1.2em;
            width: 1.2em;
            vertical-align: -0.2em;
            display: inline;
            pointer-events: none;
        }
        .changelog-empty {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 14px;
        }
        .footer {
            margin-top: 32px;
            text-align: center;
        }
        .footer-divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.3), transparent);
            border: none;
            margin-bottom: 24px;
        }
        .footer-title {
            font-size: 18px;
            font-weight: 700;
            color: #f0eeff;
            margin-bottom: 6px;
        }
        .footer-sub {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 18px;
            line-height: 1.5;
        }
        .footer-badge {
            display: inline-block;
            margin-bottom: 20px;
            opacity: 0.95;
            transition: transform 0.2s, opacity 0.2s;
        }
        .footer-badge:hover {
            transform: translateY(-2px);
            opacity: 1;
        }
        .footer-badge img {
            height: 58px;
            display: block;
            border-radius: 9px;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .footer-btn-discord {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: #5865F2;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .footer-btn-discord:hover {
            background: #4752C4;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
        }
        .footer-btn-discord svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
        .footer-btn-roblox {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .footer-btn-roblox:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            color: #fff;
            transform: translateY(-1px);
        }
        .footer-btn-roblox svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
        .footer-btn-kofi {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 18px;
            background: #000;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Quicksand', Helvetica, 'Century Gothic', sans-serif;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .footer-btn-kofi:hover {
            background: #222;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .footer-btn-kofi img {
            height: 18px;
            width: auto;
            display: inline-block;
            vertical-align: middle;
            border: none;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.15); border-radius: 3px; }
    </style>
</head>
<body>

            </div>
        </div>
    </div>
    <script src="js/changes.js"></script>
    <script src="js/new.js"></script>
</body>
</html>
